services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-reporter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-incident_reporter}"
      POSTGRES_USER: "${POSTGRES_USER:-soc_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-soc_secure_pass}"
    volumes:
      # Dedicated/separate storage volume for PostgreSQL data (e.g. attached AWS EBS volume or local host path)
      - "${HOST_PG_DIR:-./data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-soc_admin} -d $${POSTGRES_DB:-incident_reporter}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident-reporter-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env or environment}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DB: "${POSTGRES_DB:-incident_reporter}"
      POSTGRES_USER: "${POSTGRES_USER:-soc_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-soc_secure_pass}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_ARTIFACTS_ROOT: "${CONTAINER_ARTIFACTS_ROOT:-/data/artifacts}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
    volumes:
      # Dedicated/separate storage volume for investigation folders, screenshots, PCAPs, and reports
      - "${HOST_ARTIFACTS_DIR:-./artifacts}:/data/artifacts"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/status/', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-reporter-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5173}:80"
